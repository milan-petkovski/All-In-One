<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="err_page_title">All In One | 404</title>
    <meta name="description" content="Page not found. Return to the All In One extension home page.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="input.css">
</head>

<body class="bg-bglight hero-full flex items-center justify-center p-6 antialiased font-sans overflow-hidden relative">

    <main id="main" class="max-w-2xl w-full text-center relative z-10">

        <div class="flex justify-center mb-12 aio-fade-in" style="animation-delay: 0s">
            <a href="/" class="flex items-center gap-4 group" aria-label="All In One">
                <img src="/logo-128.webp" width="32" height="32" alt="All In One logo" fetchpriority="high" decoding="async" class="w-8 h-8 object-contain transition-transform duration-500 group-hover:rotate-12">
            </a>
        </div>

        <div class="relative inline-block mb-4">
            <h1 class="text-[140px] md:text-[200px] font-black text-darkpanel leading-none tracking-tighter italic aio-fade-in aio-float" style="animation-delay: 0.2s">
                404
            </h1>
            <div class="absolute -bottom-2 left-0 h-3 bg-brand rounded-full aio-line-in" aria-hidden="true"></div>
        </div>

        <div class="aio-rise-in" style="animation-delay: 0.7s">
            <h2 class="text-3xl font-black text-darkpanel uppercase tracking-tight mb-4" data-i18n="err_title">
                Page not found
            </h2>
            <p class="text-gray-500 font-medium text-lg max-w-sm mx-auto mb-12" data-i18n="err_desc">
                The All In One system cannot locate the requested file. Return to the main dashboard.
            </p>

            <a href="/"
                class="inline-flex items-center gap-4 bg-darkpanel text-white px-10 py-5 rounded-2xl font-bold hover:bg-brand hover:text-darkpanel transition-all duration-500 hover:scale-105 active:scale-95 shadow-xl group">
                <i data-lucide="arrow-left" class="w-5 h-5 transition-transform group-hover:-translate-x-1"></i>
                <span data-i18n="err_back_btn">BACK TO HOME</span>
            </a>
        </div>
    </main>

    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-full bg-brand/5 blur-[120px] -z-10" aria-hidden="true"></div>

    <script type="module" src="/main.js"></script>
</body>

</html>
