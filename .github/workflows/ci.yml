name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  extension:
    name: Extension — test, lint, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Extension

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: Extension/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Syntax check
        run: npm run check:js

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Security audit
        run: npm audit --audit-level=high

  website:
    name: Website — build, test, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Website

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: Website/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

      - name: Security audit
        run: npm audit --audit-level=high
